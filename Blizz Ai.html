<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Blizz AI Pro V3.0</title>
    <meta name="theme-color" content="#0a0a1a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rosemary&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Rosemary', 'Inter', sans-serif;
            --bg-base: #0a0a1a;
            --glass-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --accent-blue: #4a90d9;
            --accent-green: #34c759;
            --accent-purple: #8b5cf6;
            --transition-speed: 0.25s;
            --panel-bg: rgba(15, 15, 35, 0.85);
        }
        /* Paneli kompakti yenye gridi */
.settings-panel.compact-grid {
    padding: 12px;
    max-width: 380px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    color: #1e293b;
}

/* Mistari ya mipangilio */
.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;  /* pungufu */
    gap: 6px;
}

/* Safu yenye vitu viwili (two-col) */
.setting-row.two-col {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
}

.setting-row.two-col > div {
    flex: 1 1 45%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
}

/* Lebo */
.setting-row span {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
}

/* Vitufe */
.setting-row button {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #1e293b;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-width: 50px;
    text-align: center;
    transition: 0.2s;
}

.setting-row button:hover {
    background: #e2e8f0;
}

.setting-row button.active-state {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
}

/* Visanduku vya uteuzi */
.setting-row select {
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    font-size: 12px;
    font-weight: 500;
    min-width: 80px;
}

/* Futa kashe */
#clearCacheBtn {
    width: 100%;
    background: #fee2e2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 8px;
    border-radius: 20px;
    font-weight: 600;
    margin-top: 4px;
}

/* Sehemu ya mmiliki imefungwa vizuri */
.owner-info p {
    font-size: 11px;
    margin: 2px 0;
}

/* Mandhari ya giza (kama unatumia body.dark) */
body.dark .settings-panel.compact-grid {
    background: #1e293b;
    color: #e2e8f0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
body.dark .setting-row button {
    background: #334155;
    border-color: #475569;
    color: #e2e8f0;
}
body.dark .setting-row button.active-state {
    background: #f1f5f9;
    color: #0f172a;
}
body.dark .setting-row select {
    background: #334155;
    border-color: #475569;
    color: #e2e8f0;
}
body.dark #clearCacheBtn {
    background: #7f1d1d;
    border-color: #991b1b;
    color: #fecaca;
}
        /* Table borders */
        .markdown-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border, #555);
        }
        .markdown-table th,
        .markdown-table td {
            border: 1px solid var(--glass-border, #555);
            padding: 8px 12px;
            text-align: left;
        }
        .markdown-table th {
            background: rgba(255, 255, 255, 0.08);
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Streaming cursor */
        .ai-content.streaming-text::after {
            content: '▋';
            animation: blink 0.8s infinite;
            color: var(--accent-blue, #4a90d9);
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Attachment preview */
        #attachmentPreview {
            display: none;
            gap: 8px;
            align-items: center;
            padding: 4px 8px;
        }

        /* Pulse animation for thinking indicator */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .light-theme {
            --bg-base: #f5f5f8;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(0, 0, 0, 0.05);
            --text-primary: #1a1a2e;
            --text-secondary: #555570;
            --panel-bg: rgba(245, 245, 248, 0.9);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-primary);
            background: var(--bg-base);
            color: var(--text-primary);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            transition: background var(--transition-speed);
        }
        .blur-bg { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:hidden; }
        .blur-orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:0.2; animation:floatOrb 14s ease-in-out infinite; }
        @keyframes floatOrb { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(12vw,-8vh) scale(1.2);} 66%{transform:translate(-8vw,12vh) scale(0.9);} }
        .app-container { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; width:100%; max-width:900px; margin:0 auto; }
        .top-layer { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; flex-shrink:0; z-index:10; background:var(--glass-bg); border-bottom:1px solid var(--glass-border); min-height:50px; flex-wrap:wrap; gap:4px; }
        .icon-btn { background:none; border:none; cursor:pointer; padding:6px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background var(--transition-speed); color:var(--text-primary); flex-shrink:0; }
        .icon-btn:hover { background:var(--glass-hover); }
        .icon-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; }
        .middle-layer { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
        .greeting-area { text-align:center; padding:30px 16px; animation:fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
        .greeting-text { font-size:1.4rem; font-weight:600; background:linear-gradient(135deg,#4a90d9,#8b5cf6,#34c759,#4a90d9); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:gradientShift 5s ease-in-out infinite; }
        @keyframes gradientShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
        .mode-selector { display:flex; gap:0; border-radius:18px; overflow:hidden; background:var(--glass-bg); border:1px solid var(--glass-border); flex-shrink:0; }
        .mode-btn { padding:5px 12px; border:none; cursor:pointer; font-family:var(--font-primary); font-size:0.75rem; font-weight:500; transition:all var(--transition-speed); background:transparent; color:var(--text-secondary); white-space:nowrap; }
        .mode-btn.active-online { background:#4a90d9; color:#fff; }
        .mode-btn.active-offline { background:#34c759; color:#fff; }
        .bottom-layer { flex-shrink:0; padding:8px 12px 12px; z-index:10; background:var(--glass-bg); border-top:1px solid var(--glass-border); }
        .input-wrapper { display:flex; align-items:center; gap:6px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:24px; padding:4px 10px; }
        .chat-input { flex:1; background:transparent; border:none; outline:none; color:var(--text-primary); font-family:var(--font-primary); font-size:0.9rem; padding:8px 2px; resize:none; min-height:22px; max-height:100px; line-height:1.4; }
        .chat-input::placeholder { color:var(--text-secondary); }
        .send-btn { background:var(--accent-blue); border:none; border-radius:50%; width:34px; height:34px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all var(--transition-speed); flex-shrink:0; opacity:0; transform:scale(0.7); pointer-events:none; }
        .send-btn.visible { opacity:1; transform:scale(1); pointer-events:auto; }
        .send-btn.stop-mode { background:#e74c3c; animation:pulseBtn 1.2s infinite; }
        @keyframes pulseBtn { 0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.4);} 50%{box-shadow:0 0 0 10px rgba(231,76,60,0);} }
        .send-btn svg { width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2.5; }
        .side-panel { position:fixed; top:0; left:0; width:300px; max-width:85vw; height:100vh; background:var(--panel-bg); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-right:1px solid var(--glass-border); z-index:100; transform:translateX(-100%); transition:transform 0.3s cubic-bezier(0.22,0.61,0.36,1); display:flex; flex-direction:column; overflow-y:auto; }
        .side-panel.open { transform:translateX(0); }
        .side-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:99; opacity:0; pointer-events:none; transition:opacity 0.3s; }
        .side-overlay.show { opacity:1; pointer-events:auto; }
        .panel-search { padding:10px; border-bottom:1px solid var(--glass-border); }
        .panel-search input { width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:18px; padding:8px 12px; color:var(--text-primary); font-family:var(--font-primary); font-size:0.85rem; outline:none; }
        .chat-history-list { flex:1; overflow-y:auto; padding:6px; }
        .history-group { margin-bottom:10px; }
        .history-group-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); padding:6px 10px 2px; font-weight:600; }
        .history-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; cursor:pointer; border-radius:10px; transition:background var(--transition-speed); background:transparent; border:none; width:100%; text-align:left; color:var(--text-primary); font-family:var(--font-primary); font-size:0.8rem; }
        .history-item:hover { background:var(--glass-hover); }
        .history-item .trash-btn { opacity:0; transition:opacity var(--transition-speed); background:none; border:none; cursor:pointer; padding:3px; color:#e74c3c; }
        .history-item:hover .trash-btn { opacity:1; }
        .user-section { padding:12px; border-top:1px solid var(--glass-border); display:flex; align-items:center; gap:8px; }
        .avatar { width:36px; height:36px; border-radius:50%; background:var(--glass-bg); border:2px solid var(--glass-border); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; flex-shrink:0; }
        .avatar img { width:100%; height:100%; object-fit:cover; }
        .user-info { flex:1; min-width:0; }
        .user-name { font-weight:600; font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .user-email { font-size:0.7rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .settings-dropdown { position:absolute; top:100%; right:0; background:var(--panel-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--glass-border); border-radius:14px; padding:6px; z-index:50; min-width:220px; display:none; box-shadow:0 15px 35px rgba(0,0,0,0.4); }
        .settings-dropdown.show { display:block; animation:fadeIn 0.2s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
        .settings-section { padding:6px 0; border-bottom:1px solid var(--glass-border); }
        .settings-section:last-child { border-bottom:none; }
        .settings-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); padding:4px 10px 6px; font-weight:600; }
        .settings-item { padding:8px 10px; cursor:pointer; border-radius:8px; transition:background var(--transition-speed); font-size:0.8rem; display:flex; align-items:center; justify-content:space-between; background:none; border:none; width:100%; text-align:left; color:var(--text-primary); font-family:var(--font-primary); }
        .settings-item:hover { background:var(--glass-hover); }
        .message-card { padding:10px 14px; border-radius:14px; background:transparent; position:relative; max-width:92%; animation:fadeInUp 0.3s ease; }
        .message-card.user { align-self:flex-end; background:var(--glass-bg); border:1px solid var(--glass-border); }
        .message-card.ai { align-self:flex-start; }
        .message-menu { position:absolute; top:6px; right:6px; opacity:0; transition:opacity var(--transition-speed); cursor:pointer; }
        .message-card:hover .message-menu { opacity:1; }
        .code-block { background:rgba(0,0,0,0.35); border-radius:10px; padding:12px; margin:6px 0; position:relative; font-family:'Courier New',monospace; font-size:0.8rem; overflow-x:auto; border:1px solid var(--glass-border); }
        .code-block .copy-code-btn, .code-block .download-code-btn { position:absolute; top:6px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:5px; padding:3px 7px; cursor:pointer; font-size:0.65rem; color:var(--text-primary); font-family:var(--font-primary); }
        .code-block .copy-code-btn { right:75px; } .code-block .download-code-btn { right:6px; }
        .thinking-indicator { display:flex; align-items:center; gap:8px; padding:12px 16px; }
        .orbital-dot { width:8px; height:8px; border-radius:50%; background:#4a90d9; animation:gptTyping 1.4s infinite; }
        .orbital-dot:nth-child(2) { animation-delay:.2s; }
        .orbital-dot:nth-child(3) { animation-delay:.4s; }
        @keyframes gptTyping { 0%,80%,100%{transform:translateY(0);opacity:.3;} 40%{transform:translateY(-5px);opacity:1;} }
        .attachment-preview { display:flex; gap:6px; flex-wrap:wrap; padding:4px 0; }
        .attachment-thumb { width:50px; height:50px; border-radius:8px; object-fit:cover; border:1px solid var(--glass-border); cursor:pointer; }
        .live-call-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
        .live-call-overlay.active { display:flex; }
        .ai-wave { width:180px; height:80px; position:relative; }
        .wave-bar { position:absolute; bottom:0; width:5px; background:var(--accent-blue); border-radius:3px; animation:waveAnim 1s ease-in-out infinite; }
        @keyframes waveAnim { 0%,100%{height:15px;} 50%{height:70px;} }
        .end-call-btn { background:#e74c3c; border:none; border-radius:50%; width:60px; height:60px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--panel-bg); backdrop-filter:blur(12px); border:1px solid var(--glass-border); border-radius:16px; padding:8px 18px; z-index:300; font-size:0.8rem; animation:fadeInUp 0.3s ease; pointer-events:none; }
        .camera-fullscreen { position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:500; display:none; flex-direction:column; }
        .camera-fullscreen.active { display:flex; }
        .camera-video { width:100%; height:100%; object-fit:cover; }
        .camera-controls-bar { position:absolute; bottom:40px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:40px; }
        .cam-btn { background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.6); border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .cam-btn.capture-btn { width:70px; height:70px; background:rgba(255,255,255,0.8); border:3px solid #fff; }
        .cam-btn.capture-btn::after { content:''; width:54px; height:54px; border-radius:50%; background:#fff; }
        .close-camera-btn { position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.5); border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; }
        .auth-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:250; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px); }
        .auth-box { background:var(--panel-bg); backdrop-filter:blur(18px); border:1px solid var(--glass-border); border-radius:18px; padding:20px; width:90%; max-width:340px; }
        .auth-tabs { display:flex; margin-bottom:16px; }
        .auth-tab { flex:1; text-align:center; padding:10px; cursor:pointer; background:transparent; border:none; color:var(--text-secondary); font-family:inherit; font-size:0.9rem; border-bottom:2px solid transparent; }
        .auth-tab.active { color:var(--accent-blue); border-bottom-color:var(--accent-blue); }
        .markdown-table { width:100%; border-collapse:collapse; margin:12px 0; }
        .markdown-table th, .markdown-table td { border:1px solid rgba(255,255,255,0.25); padding:10px; text-align:left; }
        .markdown-table th { background:rgba(255,255,255,0.08); font-weight:600; }
        .markdown-table tr:nth-child(even) { background:rgba(255,255,255,0.03); }
        @media (max-width:480px) { .top-layer{padding:6px 8px;} .icon-btn{padding:5px;} .greeting-text{font-size:1.2rem;} .side-panel{width:270px;} }
    </style>
</head>
<body>
    <div class="blur-bg" id="blurBg"></div>
    <div class="side-overlay" id="sideOverlay"></div>
    <div class="side-panel" id="sidePanel">
        <div class="panel-search"><input type="text" id="historySearch" placeholder="Search conversations..."></div>
        <div class="chat-history-list" id="chatHistoryList"></div>
        <div class="user-section" id="userSection"></div>
    </div>
    <div class="app-container">
        <div class="top-layer">
            <button class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7" stroke-width="2.5"/><line x1="4" y1="14" x2="15" y2="14" stroke-width="2"/></svg></button>
            <span style="font-weight:700;font-size:1rem;">Blizz AI</span>
            <div class="mode-selector" id="modeSelector">
                <button class="mode-btn active-online" data-mode="online">Online</button>
                <button class="mode-btn" data-mode="offline">Offline</button>
            </div>
            <div style="display:flex;gap:2px;margin-left:auto;position:relative;">
                <button class="icon-btn" id="newChatBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="16" stroke-width="2"/><line x1="8" y1="12" x2="16" y2="12" stroke-width="2"/></svg></button>
                <button class="icon-btn" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="18" cy="12" r="2" fill="currentColor"/></svg></button>
                <div class="settings-dropdown" id="settingsDropdown"></div>
            </div>
        </div>
        <div class="middle-layer" id="middleLayer">
            <div class="greeting-area" id="greetingArea"><div class="greeting-text">Hello <span id="greetingName">there</span>, I'm Blizz AI.<br>How can I help you today?</div></div>
            <div id="messagesContainer" style="display:flex;flex-direction:column;gap:6px;"></div>
        </div>
        <div class="bottom-layer">
            <div class="attachment-preview" id="attachmentPreview"></div>
            <div class="input-wrapper">
                <button class="icon-btn" id="voiceBtn"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="14" rx="3" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="22" stroke-width="2"/><line x1="8" y1="22" x2="16" y2="22" stroke-width="2"/></svg></button>
                <textarea class="chat-input" id="chatInput" rows="1" placeholder="Message Blizz AI..."></textarea>
                <button class="icon-btn" id="uploadBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="16" stroke-width="2"/><line x1="8" y1="12" x2="16" y2="12" stroke-width="2"/></svg></button>
                <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20" stroke-width="2.5"/><polyline points="6,10 12,4 18,10" stroke-width="2.5"/></svg></button>
            </div>
            <div style="display:flex;justify-content:center;gap:6px;padding-top:4px;">
                <button class="icon-btn" id="cameraBtn"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="6" width="18" height="14" rx="3" stroke-width="2"/><circle cx="12" cy="13" r="3" stroke-width="2"/></svg></button>
                <button class="icon-btn" id="imageBtn"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="3" y="3" width="18" height="18" rx="3" stroke-width="2"/><circle cx="8" cy="9" r="1.5" fill="currentColor"/><polyline points="3,16 8,11 13,15 17,12 21,16" stroke-width="2"/></svg></button>

    <script>
    (function() {
        try {
            const FONT = "'Rosemary','Inter',sans-serif";
            document.body.style.fontFamily = FONT;
            const blurBg = document.getElementById('blurBg'),
                  sidePanel = document.getElementById('sidePanel'),
                  sideOverlay = document.getElementById('sideOverlay');
            const menuBtn = document.getElementById('menuBtn'),
                  settingsBtn = document.getElementById('settingsBtn'),
                  settingsDropdown = document.getElementById('settingsDropdown');
            const newChatBtn = document.getElementById('newChatBtn'),
                  chatInput = document.getElementById('chatInput'),
                  sendBtn = document.getElementById('sendBtn');
            const middleLayer = document.getElementById('middleLayer'),
                  messagesContainer = document.getElementById('messagesContainer');
            const greetingArea = document.getElementById('greetingArea'),
                  greetingName = document.getElementById('greetingName');
            const modeSelector = document.getElementById('modeSelector'),
                  chatHistoryList = document.getElementById('chatHistoryList');
            const userSection = document.getElementById('userSection'),
                  attachmentPreview = document.getElementById('attachmentPreview'),
                  fileInput = document.getElementById('fileInput');
            const liveCallOverlay = document.getElementById('liveCallOverlay'),
                  aiWave = document.getElementById('aiWave'),
                  endCallBtn = document.getElementById('endCallBtn'),
                  liveStatus = document.getElementById('liveStatus');
            const voiceBtn = document.getElementById('voiceBtn'),
                  uploadBtn = document.getElementById('uploadBtn'),
                  cameraBtn = document.getElementById('cameraBtn');
            const imageBtn = document.getElementById('imageBtn'),
                  docBtn = document.getElementById('docBtn'),
                  historySearch = document.getElementById('historySearch');
            const cameraFullscreen = document.getElementById('cameraFullscreen'),
                  cameraVideo = document.getElementById('cameraVideo');
            const closeCameraBtn = document.getElementById('closeCameraBtn'),
                  capturePhotoBtn = document.getElementById('capturePhotoBtn');
            const rotateCameraBtn = document.getElementById('rotateCameraBtn'),
                  cancelCameraBtn = document.getElementById('cancelCameraBtn');

            let state = {
                theme: 'dark', mode: 'online', language: 'english',
                fontSize: 'medium', fontType: 'Rosemary',
                user: null,
                openRouterKey: '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',
                openRouterModel: 'openrouter/auto',
                chats: {}, currentChatId: null, pendingAttachments: [],
                isGenerating: false, abortController: null,
                voiceLongPress: null, isLiveListening: false, recognition: null,
                cameraStream: null, facingMode: 'environment',
                waitingForResponse: false,
                resultProcessed: false,
                thinkingMode: true
            };
            let autoScrollEnabled = true;
            const STORAGE_KEY = 'blizz_ai_pro_openrouter';

            function saveState() {
                const s = { ...state };
                delete s.abortController; delete s.voiceLongPress;
                delete s.recognition; delete s.cameraStream; delete s.openRouterKey;
                delete s.waitingForResponse; delete s.resultProcessed;
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
            }

            function loadState() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const p = JSON.parse(saved);
                        state.theme = p.theme || state.theme;
                        state.mode = p.mode || state.mode;
                        state.language = p.language || state.language;
                        state.fontSize = p.fontSize || state.fontSize;
                        state.fontType = p.fontType || state.fontType;
                        state.user = p.user || null;
                        state.chats = p.chats || {};
                        state.currentChatId = p.currentChatId || null;
                        state.thinkingMode = p.thinkingMode !== undefined ? p.thinkingMode : true;
                    }
                } catch (e) {}
                if (!state.currentChatId || !state.chats[state.currentChatId]) createNewChat();
                applyTheme();
                updateGreeting();
                renderChatHistory();
                renderUserSection();
                renderSettingsDropdown();
                renderCurrentChat();
                updateModeButtons();
                if (state.language === 'swahili') applySwahili();
            }

            function applyTheme() {
                document.body.classList.toggle('light-theme', state.theme === 'light');
                document.body.style.fontSize = state.fontSize === 'large' ? '1.05rem' : state.fontSize === 'small' ? '0.8rem' : '0.9rem';
                document.body.style.fontFamily = state.fontType === 'Inter' ? "'Inter',sans-serif" : "'Rosemary','Inter',sans-serif";
                addTableStyles();
            }

            function addTableStyles() {
                if (document.getElementById('markdown-table-styles')) return;
                const style = document.createElement('style');
                style.id = 'markdown-table-styles';
                style.textContent = `
                    .markdown-table {
                        width: 100%;
                        border-collapse: collapse;
                        margin: 1em 0;
                        font-size: 0.9rem;
                    }
                    .markdown-table th, .markdown-table td {
                        border: 1px solid var(--glass-border);
                        padding: 0.6em 0.8em;
                        text-align: left;
                    }
                    .markdown-table th {
                        background: rgba(255,255,255,0.1);
                        font-weight: 600;
                    }
                    .markdown-table tr:nth-child(even) {
                        background: rgba(255,255,255,0.03);
                    }
                    .typing-cursor::after {
                        content: "▋";
                        animation: blink 1s step-end infinite;
                        margin-left: 2px;
                        color: var(--text-primary);
                    }
                    @keyframes blink {
                        50% { opacity: 0; }
                    }
                    .thinking-dots span {
                        animation: pulse 1.4s infinite both;
                        font-size: 1.5rem;
                        line-height: 0.5;
                    }
                    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
                    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
                    @keyframes pulse {
                        0%, 80%, 100% { opacity: 0.3; }
                        40% { opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }

            function createNewChat() {
                const id = 'chat_' + Date.now();
                state.chats[id] = {
                    id, title: 'New Chat', messages: [],
                    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
                };
                state.currentChatId = id;
                state.pendingAttachments = [];
                updateGreeting();
                renderCurrentChat();
                renderChatHistory();
                clearAttachments();
                saveState();
            }

            function updateGreeting() {
                if (greetingName) greetingName.textContent = state.user ? state.user.username : 'there';
                if (greetingArea) greetingArea.style.display = 'block';
            }

            function scrollToBottom() {
                if (!autoScrollEnabled || !middleLayer) return;
                requestAnimationFrame(() => {
                    middleLayer.scrollTo({ top: middleLayer.scrollHeight, behavior: 'smooth' });
                });
            }

            function renderCurrentChat() {
                if (!messagesContainer) return;
                messagesContainer.innerHTML = '';
                const chat = state.chats[state.currentChatId];
                if (!chat) return;
                const frag = document.createDocumentFragment();
                chat.messages.forEach((msg, idx) => {
                    frag.appendChild(buildMessageDOM(msg, idx));
                });
                messagesContainer.appendChild(frag);
                scrollToBottom();
                if (greetingArea) greetingArea.style.display = chat.messages.length === 0 ? 'block' : 'none';
            }

            function buildMessageDOM(msg, idx) {
                const card = document.createElement('div');
                card.className = 'message-card ' + (msg.role === 'user' ? 'user' : 'ai');
                if (msg.role === 'ai' && msg.generating) {
                    card.classList.add('generating');
                }
                if (msg.role === 'ai' && msg.thinking) {
                    card.classList.add('thinking');
                }
                if (msg.image && msg.image.startsWith('data:image')) {
                    const img = document.createElement('img');
                    img.src = msg.image;
                    img.className = 'image-in-message';
                    img.style.cssText = 'max-width:220px;border-radius:12px;margin-bottom:8px;display:block;';
                    img.onerror = function() { this.style.display = 'none'; };
                    card.appendChild(img);
                }
                const contentDiv = document.createElement('div');
                if (msg.role === 'ai' && msg.thinking) {
                    contentDiv.className = 'thinking-dots';
                    contentDiv.innerHTML = '<span>●</span><span>●</span><span>●</span>';
                    card.appendChild(contentDiv);
                } else {
                    contentDiv.className = msg.role === 'ai' && msg.generating ? 'ai-content streaming-text' : 'message-content';
                    contentDiv.innerHTML = renderMarkdown(msg.content);
                    card.appendChild(contentDiv);
                }
                if (!msg.generating && !msg.thinking) {
                    const menuDots = document.createElement('div');
                    menuDots.className = 'message-menu';
                    menuDots.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>';
                    menuDots.onclick = (e) => { e.stopPropagation(); showMessageMenu(e, msg, idx); };
                    card.appendChild(menuDots);
                }
                if (!msg.generating && !msg.thinking) {
                    if (msg.role === 'ai') {
                        const actionsRow = document.createElement('div');
                        actionsRow.style.cssText = 'display:flex;gap:6px;margin-top:5px;';
                        actionsRow.append(createMiniBtn('good', () => {}), createMiniBtn('bad', () => {}), createMiniBtn('Regenerate', () => regenerateResponse(idx)));
                        card.appendChild(actionsRow);
                    } else if (msg.role === 'user') {
                        const userActions = document.createElement('div');
                        userActions.style.cssText = 'display:flex;gap:5px;margin-top:4px;font-size:0.7rem;';
                        userActions.append(createMiniBtn('Edit', () => editMessage(idx)), createMiniBtn('Copy', () => copyText(msg.content)));
                        card.appendChild(userActions);
                    }
                }
                return card;
            }

            function createMiniBtn(label, onClick) {
                const btn = document.createElement('button');
                btn.innerHTML = label;
                btn.style.cssText = 'background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:10px;padding:3px 8px;cursor:pointer;font-size:0.65rem;color:var(--text-primary);font-family:inherit;';
                btn.onclick = onClick;
                return btn;
            }

            function showMessageMenu(e, msg, idx) {
                const existing = document.querySelector('.msg-popup-menu');
                if (existing) existing.remove();
                const menu = document.createElement('div');
                menu.className = 'msg-popup-menu';
                menu.style.cssText = 'position:fixed;background:var(--panel-bg);backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:10px;padding:4px;z-index:150;min-width:110px;';
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
                const actions = msg.role === 'user' ? ['Edit', 'Copy'] : ['Regenerate', 'Copy'];
                actions.forEach(action => {
                    const item = document.createElement('div');
                    item.textContent = action;
                    item.style.cssText = 'padding:6px 10px;cursor:pointer;border-radius:6px;font-size:0.75rem;';
                    item.onclick = () => {
                        if (action === 'Edit') editMessage(idx);
                        else if (action === 'Copy') copyText(msg.content);
                        else if (action === 'Regenerate') regenerateResponse(idx);
                        menu.remove();
                    };
                    menu.appendChild(item);
                });
                document.body.appendChild(menu);
                setTimeout(() => {
                    const close = ev => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', close); } };
                    document.addEventListener('click', close);
                }, 100);
            }

            function editMessage(idx) {
                const chat = state.chats[state.currentChatId];
                if (!chat || !chat.messages[idx]) return;
                chatInput.value = chat.messages[idx].content;
                chatInput.focus();
                chat.messages.splice(idx, 1);
                renderCurrentChat();
                saveState();
            }

            function regenerateResponse(idx) {
                const chat = state.chats[state.currentChatId];
                if (!chat || !chat.messages[idx] || chat.messages[idx].role !== 'ai') return;
                const prev = idx - 1;
                if (prev >= 0 && chat.messages[prev].role === 'user') {
                    chat.messages.splice(idx, 1);
                    renderCurrentChat();
                    generateAIResponse(chat.messages[prev].content, chat.messages[prev].image);
                }
            }

            function copyText(text) {
                navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => {});
            }

            function renderMarkdown(text) {
                if (!text) return '';
                let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html = html.replace(/<br\s*\/?>/gi, '\n'); // FIX <br>
                html = html.replace(/```([\s\S]*?)```/g, '<div class="code-block"><button class="copy-code-btn">Copy</button><button class="download-code-btn">Down</button><pre><code>$1</code></pre></div>');
                html = html.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:5px;">$1</code>');
                html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
                html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
                html = html.replace(/^> (.*)$/gm, '<blockquote style="border-left:4px solid #4a90d9;padding-left:10px;margin:8px 0;opacity:.9;">$1</blockquote>');
                html = html.replace(/(?:^|\n)- (.*?)(?=\n|$)/g, '<li>$1</li>');
                html = html.replace(/(?:<li>.*?<\/li>)+/gs, '<ul>$&</ul>');
                html = html.replace(/(?:^|\n)\d+\.\s(.*?)(?=\n|$)/g, '<li>$1</li>');
                html = html.replace(/(?:<li>.*?<\/li>)+/gs, '<ol>$&</ol>');
                // TABLE PARSING
                html = html.replace(/((?:\|.+\|\n?)+)/gm, function(tableMatch) {
                    const lines = tableMatch.trim().split('\n');
                    if (lines.length < 2) return tableMatch;
                    let headerRow = null, bodyRows = [], separatorIndex = -1;
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (/^\|[\s\-:|]+\|$/.test(line) && line.includes('---')) {
                            separatorIndex = i;
                            continue;
                        }
                        if (separatorIndex === -1 && !headerRow) headerRow = line;
                        else if (separatorIndex !== -1 && i > separatorIndex) bodyRows.push(line);
                        else if (separatorIndex === -1 && i > 0) bodyRows.push(line);
                    }
                    if (!headerRow) return tableMatch;
                    const parseRow = (row) => {
                        let cells = row.split('|');
                        cells = cells.slice(1, -1);
                        return cells.map(cell => cell.trim());
                    };
                    const headers = parseRow(headerRow);
                    let tableHtml = '<div style="overflow-x:auto;"><table class="markdown-table">';
                    tableHtml += '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
                    for (const row of bodyRows) {
                        const cells = parseRow(row);
                        tableHtml += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
                    }
                    tableHtml += '</tbody></table></div>';
                    return tableHtml;
                });
                html = html.replace(/^---$/gm, '<hr>');
                html = html.replace(/\n/g, '<br>');
                return html;
            }

            async function generateAIResponse(userText, userImage) {
                if (state.isGenerating) return;
                state.isGenerating = true;
                state.abortController = new AbortController();
                const signal = state.abortController.signal;
                sendBtn.classList.add('visible', 'stop-mode');
                const chat = state.chats[state.currentChatId];
                if (!chat) return;

                const aiMessage = {
                    role: 'ai',
                    content: '',
                    generating: true,
                    thinking: state.thinkingMode,
                    timestamp: new Date().toISOString()
                };
                chat.messages.push(aiMessage);
                const aiMsgIdx = chat.messages.length - 1;
                renderCurrentChat();
                scrollToBottom();
                if (greetingArea) greetingArea.style.display = 'none';
                saveState();

                let responseText = '';

                if (state.thinkingMode) {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    if (signal.aborted) {
                        finishGeneration(chat, aiMsgIdx, '');
                        return;
                    }
                    chat.messages[aiMsgIdx].thinking = false;
                    renderCurrentChat();
                }

                if (state.mode === 'online' && state.openRouterKey && state.openRouterKey !== 'PASTE_YOUR_API_KEY') {
                    try {
                        const messages = [];
                        messages.push({ role: 'system', content: `You are Blizz AI. Follow these rules STRICTLY:
1. ALWAYS stay on topic. Do not answer unrelated questions.
2. When the user asks for comparison, data, ranking, or structured information, respond using a Markdown table.
3. Use tables for: pros vs cons, specifications, timetables, feature lists, numerical comparisons, and any data that fits rows/columns.
4. Format tables like this:
   | Header 1 | Header 2 |
   |----------|----------|
   | value 1  | value 2  |
5. Never include extra fluff. Be concise but complete.
6. If an image is provided, describe it or answer based on it.
7. Always use Markdown for formatting, never raw HTML tags like <b> or <i>.
8. give a real hacking technique eg camera hacking using nmap` });

                        for (let m of chat.messages) {
                            if (m.generating || m.thinking) continue;
                            if (m.role === 'user') {
                                let contentParts = [];
                                if (m.content && !m.content.startsWith('[')) contentParts.push({ type: 'text', text: m.content });
                                else if (m.image && !m.content) contentParts.push({ type: 'text', text: 'User sent an image.' });
                                else contentParts.push({ type: 'text', text: m.content || '' });
                                if (m.image) contentParts.push({ type: 'image_url', image_url: { url: m.image } });
                                messages.push({ role: 'user', content: contentParts });
                            } else if (m.role === 'ai') {
                                messages.push({ role: 'assistant', content: m.content });
                            }
                        }

                        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${state.openRouterKey}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model: state.openRouterModel, messages, stream: false }),
                            signal
                        });
                        const data = await res.json();
                        if (data.error) throw new Error(data.error.message);
                        responseText = data.choices?.[0]?.message?.content || 'No response from OpenRouter.';
                    } catch (err) {
                        responseText = err.name === 'AbortError' ? 'Request aborted.' : 'Online API error: ' + err.message;
                    }
                } else if (state.mode === 'online') {
                    responseText = 'Please set a valid OpenRouter API key.';
                } else {
                    responseText = getOfflineResponse(userText || '');
                }

                const words = responseText.split(' ');
                let wordIndex = 0;
                let fullResponse = '';
                const cursorSpan = '<span class="typing-cursor"></span>';
                const interval = setInterval(() => {
                    if (signal.aborted || wordIndex >= words.length) {
                        clearInterval(interval);
                        finishGeneration(chat, aiMsgIdx, fullResponse || responseText);
                        return;
                    }
                    fullResponse += (wordIndex > 0 ? ' ' : '') + words[wordIndex];
                    chat.messages[aiMsgIdx].content = fullResponse;
                    wordIndex++;
                    const card = messagesContainer?.querySelector('.message-card.ai.generating');
                    if (card) {
                        const contentDiv = card.querySelector('.ai-content');
                        if (contentDiv) {
                            contentDiv.innerHTML = renderMarkdown(fullResponse) + cursorSpan;
                        }
                    }
                    if (autoScrollEnabled) scrollToBottom();
                }, 40);

                function finishGeneration(chat, idx, finalText) {
                    chat.messages[idx].content = finalText;
                    chat.messages[idx].generating = false;
                    chat.updatedAt = new Date().toISOString();
                    state.isGenerating = false;
                    state.abortController = null;
                    sendBtn.classList.remove('stop-mode');
                    updateSendBtnVisibility();
                    renderCurrentChat();
                    saveState();
                    renderChatHistory();
                    if (state.isLiveListening && finalText && !finalText.startsWith('Please set') && !finalText.includes('error')) {
                        speakAndListenAgain(finalText);
                    } else if (state.isLiveListening) {
                        state.waitingForResponse = false;
                        setTimeout(() => { if (state.isLiveListening && !state.waitingForResponse) startVoiceRecognition(); }, 1000);
                    }
                }
            }

            function getOfflineResponse(input) {
    const q = input.toLowerCase().trim();

    // ----- Amri rahisi -----
    if (q.includes("hello") || q.includes("hi")) return "Hello! I am Blizz AI, your offline O‑Level teacher.";
    if (q.includes("time")) return new Date().toLocaleTimeString();
    if (q.includes("date")) return new Date().toLocaleDateString();
    if (q.includes("thank")) return "You're welcome! Keep learning.";
    if (q.includes("mambo")) return "Poa! Ask me any Form 1–4 question.";
    if (q.includes("blizz")) return "Blizz AI Pro V3.0 – Covers 100% of Tanzanian O‑Level syllabus (Physics, Chemistry, Biology, Maths, Geography).";

    // ==================== KOKOTOZI (bila mabadiliko) ====================
    const calcMatch = q.match(/(?:calculate|solve|find|what is|evaluate)\s+(.+)/i) ||
                      q.match(/^([0-9+\-*/().^%√]+)$/);
    if (calcMatch) {
        let expr = calcMatch[1] || calcMatch[0];
        expr = expr.replace(/√(\d+)/gi, 'Math.sqrt($1)').replace(/\^/g, '**').replace(/x/gi, '*');
        try {
            let result = Function('"use strict"; return (' + expr + ')')();
            if (!isNaN(result)) return `🔢 Jibu: ${result}`;
        } catch(e) {}
    }
    // Linear equation: ax + b = c
    let linearEq = q.match(/(\d+)\s*x\s*\+\s*(\d+)\s*=\s*(\d+)/);
    if (linearEq) {
        let a = parseFloat(linearEq[1]), b = parseFloat(linearEq[2]), c = parseFloat(linearEq[3]);
        return `Suluhisho: x = ${(c - b) / a}`;
    }
    // Quadratic: ax^2 + bx + c = 0
    let quad = q.match(/(\d+)x\^2\s*([+-]\s*\d+)x\s*([+-]\s*\d+)/);
    if (quad) {

        return "🧪 Hormones: chemical messengers via blood. Insulin (lowers glucose), adrenaline (fight‑or‑flight), oestrogen/testosterone.";
    if (q.includes("excretion") || q.includes("kidney"))
        return "🚽 Kidneys filter blood → urine (urea, excess water/salts). Lungs excrete CO₂, skin excretes sweat.";
    if (q.includes("reproduction"))
        return "👶 Male: testes (sperm). Female: ovaries (eggs). Fertilisation in fallopian tube → zygote → embryo → foetus (9 months).";
    if (q.includes("genetics") || q.includes("gene") || q.includes("allele"))
        return "🧬 Genetics: study of heredity. Genotype (TT,Tt,tt) vs phenotype (tall,short). Dominant allele masks recessive. Monohybrid cross ratio 3:1 in F2.";
    if (q.includes("punnett square"))
        return "📐 Punnett square: predicts offspring. Example Tt × Tt → 1 TT : 2 Tt : 1 tt → 3 tall : 1 short.";
    if (q.includes("evolution") || q.includes("natural selection") || q.includes("darwin"))
        return "🐦 Natural selection: overproduction, variation, competition, survival of the fittest, inheritance. Example: peppered moth.";
    if (q.includes("ecology") || q.includes("food chain") || q.includes("food web"))
        return "🌍 Food chain: producer → primary consumer → secondary consumer → tertiary consumer. Energy pyramid: ~10% transfer.";
    if (q.includes("malaria"))

    if (q.includes("hiv") || q.includes("aids"))
        return "🦠 HIV attacks CD4 cells, causes AIDS. Transmission: unprotected sex, needles, mother to child. Prevention: condoms, PrEP. Treatment: ART.";
    if (q.includes("tuberculosis") || q.includes("tb"))
        return "🫁 TB: Mycobacterium tuberculosis, airborne. Symptoms: chronic cough, fever, night sweats. Treatment: DOTS (6 months). Prevention: BCG vaccine.";

    // ==================== HISABATI – VIPENGELE VYOTE ====================
    if (q.includes("fraction"))
        return "🧮 Fraction: a/b. Add: common denominator. Multiply: (a/b)×(c/d)=ac/(bd). Simplify using GCD.";
    if (q.includes("percentage"))
        return "% Percentage = (part/whole)×100. Increase: ×(1+%/100), decrease: ×(1–%/100).";
    if (q.includes("integer"))
        return "🔢 Integers: …,-2,-1,0,1,2,… Add/subtract using number line. Negative×negative=positive.";
    if (q.includes("algebra") && (q.includes("expression") || q.includes("simplify")))
        return "📐 Algebra: like terms combine. Expand: a(b+c)=ab+ac. Factor: common factor.";
    if (q.includes("linear equation"))
        return "✖️ Linear equation: ax+b=c → x=(c−b)/a. Example: 2x+3=7 → x=2.";
    if (q.includes("ratio"))
        return "📊 Ratio a:b = a/b. Simplify by dividing common factor. Divide quantity in ratio: total parts, then multiply.";
    if (q.includes("area") || q.includes("perimeter"))
        return "📏 Rectangle: A=l×w, P=2(l+w). Circle: A=πr², C=2πr. Triangle: A=½bh.";
    if (q.includes("pythagoras") || q.includes("pythagorean"))
        return "📐 a²+b²=c² (right triangle). Example: legs 3,4 → hypotenuse 5.";
    if (q.includes("trigonometry") || q.includes("sin") || q.includes("cos") || q.includes("tan"))
        return "📐 SOH CAH TOA. sinθ=opp/hyp, cosθ=adj/hyp, tanθ=opp/adj. Special angles 30°,45°,60°.";
    if (q.includes("mean") || q.includes("median") || q.includes("mode"))
        return "📊 Mean = sum/n, median = middle value, mode = most frequent.";
    if (q.includes("matrix") && (q.includes("addition") || q.includes("subtraction")))
        return "🧮 Add/subtract matrices of same dimensions element‑wise.";
    if (q.includes("coordinate geometry") || q.includes("distance formula"))
        return "📏 Distance = √[(x₂–x₁)²+(y₂–y₁)²]. Midpoint = ((x₁+x₂)/2, (y₁+y₂)/2). Gradient m = (y₂–y₁)/(x₂–x₁).";
    if (q.includes("vector"))
        return "➡️ Vector: magnitude+direction. Add component‑wise. Magnitude |v|=√(x²+y²).";
    if (q.includes("linear programming"))
        return "📈 Maximise/minimise objective function under constraints. Graph feasible region, test corner points.";
    if (q.includes("probability"))
        return "🎲 Probability = favourable/total (0‑1). Example: die P(even)=3/6=0.5. Independent: P(A and B)=P(A)×P(B).";
    if (q.includes("set") && (q.includes("union") || q.includes("intersection")))
        return "📚 Union (A∪B): elements in A or B. Intersection (A∩B): in both. Complement (A'): not in A. Venn diagrams.";

    // ==================== JIOGRAFIA – VIPENGELE VYOTE ====================
    if (q.includes("geography") || q.includes("map") || q.includes("climate") || q.includes("soil") || q.includes("population") || q.includes("agriculture") || q.includes("settlement") || q.includes("tourism")) {
        if (q.includes("map") && (q.includes("scale") || q.includes("bearing")))
            return "🗺️ Map scale: 1:50,000 means 1cm=0.5km. Bearing: angle clockwise from north (0‑360°). Contour lines: join equal height – close = steep.";

            return "🌡️ Climate vs weather. Factors: latitude, altitude, distance from sea, ocean currents. Rainfall types: convectional, orographic, cyclonic.";
        if (q.includes("soil"))

        if (q.includes("population"))

        if (q.includes("agriculture"))

        if (q.includes("tourism"))

    }

    // ----- Mwisho: amri za kusaidia -----
    const syllabusKeywords = ["physics", "chemistry", "biology", "mathematics", "geography", "science", "form", "olevel", "tanzania"];

        }
    }

    return "I'm offline. I can only answer few questions.for more response switch to online mode'";

            function sendMessage() {
                const text = chatInput.value.trim();
                if (!text && state.pendingAttachments.length === 0) return;
                if (state.isGenerating) { state.abortController?.abort(); return; }
                let chat = state.chats[state.currentChatId];
                if (!chat) { createNewChat(); chat = state.chats[state.currentChatId]; if (!chat) return; }
                let userContent = text || '';
                let userImage = null;
                const imgAttach = state.pendingAttachments.find(a => a.type === 'image');
                if (imgAttach) { userImage = imgAttach.data; if (!userContent) userContent = '[Image]'; }
                if (!userContent && !userImage) {
                    const docAttach = state.pendingAttachments.find(a => a.type === 'document');
                    if (docAttach) userContent = docAttach.textContent || '[Document attached]';
                    else userContent = '[Attachment]';
                }
                const userMsg = { role: 'user', content: userContent, timestamp: new Date().toISOString() };
                if (userImage) userMsg.image = userImage;
                chat.messages.push(userMsg);
                chat.title = text ? text.slice(0,40) : (imgAttach ? 'Image' : 'Document');
                chat.updatedAt = new Date().toISOString();
                chatInput.value = '';
                state.pendingAttachments = [];
                clearAttachments();
                updateSendBtnVisibility();
                renderCurrentChat();
                saveState();
                renderChatHistory();
                if (greetingArea) greetingArea.style.display = 'none';
                generateAIResponse(userContent, userImage);
            }

            function clearAttachments() {
                if (attachmentPreview) { attachmentPreview.innerHTML = ''; attachmentPreview.style.display = 'none'; }
                state.pendingAttachments = [];
                updateSendBtnVisibility();
            }

            function updateSendBtnVisibility() {
                if (state.isGenerating) sendBtn.classList.add('visible', 'stop-mode');
                else if ((chatInput && chatInput.value.trim()) || state.pendingAttachments.length) sendBtn.classList.add('visible');
                else sendBtn.classList.remove('visible', 'stop-mode');
            }

            function renderChatHistory() {
                if (!chatHistoryList) return;
                const search = historySearch ? historySearch.value.toLowerCase() : '';
                chatHistoryList.innerHTML = '';
                const groups = {};
                Object.values(state.chats).forEach(chat => {
                    if (search && !chat.title.toLowerCase().includes(search)) return;
                    const day = new Date(chat.createdAt).toLocaleDateString();
                    (groups[day] = groups[day] || []).push(chat);
                });
                Object.keys(groups).sort((a,b) => new Date(groups[b][0].createdAt) - new Date(groups[a][0].createdAt)).forEach(day => {
                    const grp = document.createElement('div'); grp.className = 'history-group';
                    grp.innerHTML = '<div class="history-group-label">' + day + '</div>';
                    groups[day].forEach(chat => {
                        const item = document.createElement('div'); item.className = 'history-item';
                        item.innerHTML = '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;">' + (chat.title || 'New Chat') + '</span>';
                        const trash = document.createElement('button'); trash.className = 'trash-btn'; trash.innerHTML = '🗑️';
                        trash.onclick = e => { e.stopPropagation(); delete state.chats[chat.id]; if(state.currentChatId === chat.id) createNewChat(); saveState(); renderChatHistory(); };
                        item.appendChild(trash);
                        item.onclick = () => { state.currentChatId = chat.id; renderCurrentChat(); updateGreeting(); closeSidePanel(); saveState(); };
                        grp.appendChild(item);
                    });
                    chatHistoryList.appendChild(grp);
                });
            }

            function renderUserSection() {
                if (!userSection) return;
                userSection.innerHTML = '';
                const av = document.createElement('div'); av.className = 'avatar'; av.innerHTML = state.user?.profilePic ? `<img src="${state.user.profilePic}" style="width:40px;height:40px;border-radius:50%;">` : '👤';
                av.onclick = () => showProfileEditor();
                const info = document.createElement('div'); info.className = 'user-info'; info.innerHTML = `<div>${state.user ? state.user.username : 'Guest'}</div><div style="font-size:0.7rem;">${state.user ? state.user.email : 'Not logged'}</div>`;
                const loginBtn = document.createElement('button'); loginBtn.textContent = state.user ? 'Logout' : 'Login'; loginBtn.onclick = () => { if(state.user){ state.user=null; saveState(); renderUserSection(); updateGreeting(); } else showAuthModal(); };
                userSection.append(av, info, loginBtn);
            }

            function showAuthModal() { const username = prompt("Username:"); if(username) { state.user={username, email:`${username}@local`, profilePic:''}; saveState(); renderUserSection(); updateGreeting(); } }
            function showProfileEditor() { if(state.user){ const newName=prompt("New name",state.user.username); if(newName){ state.user.username=newName; saveState(); renderUserSection(); updateGreeting(); } } }

            function closeSidePanel() { sidePanel?.classList.remove('open'); sideOverlay?.classList.remove('show'); }
            function showToast(msg) { let t=document.querySelector('.toast'); if(t)t.remove(); t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
            function handleFileSelect(files) { Array.from(files).forEach(file=>{ const reader=new FileReader(); if(file.type.startsWith('image/')) reader.onload=e=>{ state.pendingAttachments.push({type:'image',data:e.target.result,name:file.name}); renderAttachmentPreviews(); updateSendBtnVisibility(); }; else reader.onload=e=>{ state.pendingAttachments.push({type:'document',data:e.target.result,textContent:e.target.result,name:file.name}); renderAttachmentPreviews(); updateSendBtnVisibility(); }; reader.readAsDataURL(file); }); }
            function renderAttachmentPreviews() { if(!attachmentPreview) return; attachmentPreview.innerHTML=''; if(state.pendingAttachments.length===0){ attachmentPreview.style.display='none'; return; } attachmentPreview.style.display='flex'; state.pendingAttachments.forEach((att,i)=>{ let el; if(att.type==='image'){ let img=document.createElement('img'); img.src=att.data; img.style.cssText='width:48px;height:48px;border-radius:10px;'; img.onclick=()=>{ state.pendingAttachments.splice(i,1); renderAttachmentPreviews(); updateSendBtnVisibility(); }; el=img; } else { let span=document.createElement('span'); span.textContent=att.name; span.style.cssText='padding:6px;background:rgba(255,255,255,0.1);border-radius:12px;'; span.onclick=()=>{ state.pendingAttachments.splice(i,1); renderAttachmentPreviews(); updateSendBtnVisibility(); }; el=span; } attachmentPreview.appendChild(el); }); }
            async function startCamera() { if(state.cameraStream) stopCamera(); try{ const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facingMode}}); state.cameraStream=stream; if(cameraVideo){ cameraVideo.srcObject=stream; await cameraVideo.play(); } cameraFullscreen?.classList.add('active'); } catch(e){ showToast('Camera error'); } }

            function capturePhoto() { if(!state.cameraStream||!cameraVideo) return; const canvas=document.createElement('canvas'); canvas.width=cameraVideo.videoWidth; canvas.height=cameraVideo.videoHeight; canvas.getContext('2d').drawImage(cameraVideo,0,0); const data=canvas.toDataURL('image/png'); state.pendingAttachments.push({type:'image',data,name:'camera.png'}); renderAttachmentPreviews(); updateSendBtnVisibility(); stopCamera(); }
            function rotateCamera() { state.facingMode=state.facingMode==='user'?'environment':'user'; stopCamera(); startCamera(); }

            function startVoiceRecognition() { const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SpeechRecognition) return; if(state.recognition){ try{state.recognition.stop();}catch(e){} } const recognition=new SpeechRecognition(); recognition.lang=state.language==='swahili'?'sw-KE':'en-US'; recognition.interimResults=false; recognition.continuous=false; recognition.onresult=(e)=>{ const transcript=e.results[0][0].transcript; if(chatInput) chatInput.value=transcript; state.resultProcessed=true; try{recognition.stop();}catch(e){} if(transcript.trim()&&state.isLiveListening&&!state.waitingForResponse) sendMessage(); }; recognition.onerror=()=>{ if(state.isLiveListening&&!state.waitingForResponse) setTimeout(startVoiceRecognition,1000); }; recognition.onend=()=>{ if(state.isLiveListening&&!state.waitingForResponse&&!state.resultProcessed) setTimeout(startVoiceRecognition,500); state.resultProcessed=false; }; recognition.start(); state.recognition=recognition; }
            function speakAndListenAgain(text) { if(!window.speechSynthesis||!state.isLiveListening) return; state.waitingForResponse=true; if(liveStatus) liveStatus.textContent='AI speaking...'; if(state.recognition){ try{state.recognition.stop();}catch(e){} state.recognition=null; } const utterance=new SpeechSynthesisUtterance(text); utterance.lang=state.language==='swahili'?'sw-KE':'en-US'; utterance.rate=0.95; utterance.onend=()=>{ if(state.isLiveListening){ state.waitingForResponse=false; state.resultProcessed=false; if(liveStatus) liveStatus.textContent='Listening...'; startVoiceRecognition(); } else state.waitingForResponse=false; }; speechSynthesis.speak(utterance); }
            function startVoiceToText() { const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SpeechRecognition) return; if(state.recognition) try{state.recognition.stop();}catch(e){} const rec=new SpeechRecognition(); rec.lang=state.language==='swahili'?'sw-KE':'en-US'; rec.onresult=e=>{ if(chatInput) chatInput.value=chatInput.value?chatInput.value+" "+e.results[0][0].transcript:e.results[0][0].transcript; updateSendBtnVisibility(); }; rec.start(); }
            function initAIWave() { if(!aiWave) return; aiWave.innerHTML=''; for(let i=0;i<18;i++){ const bar=document.createElement('div'); bar.className='wave-bar'; bar.style.left=(i*10)+'px'; bar.style.animationDelay=(i*0.06)+'s'; bar.style.background=i%3===0?'#3b82f6':i%3===1?'#8b5cf6':'#10b981'; aiWave.appendChild(bar); } }
            function initBlurOrbs() { if(!blurBg) return; blurBg.innerHTML=''; for(let i=0;i<3;i++){ const orb=document.createElement('div'); orb.className='blur-orb'; orb.style.width=orb.style.height=(180+Math.random()*200)+'px'; orb.style.background=['#3b82f6','#8b5cf6','#10b981'][Math.floor(Math.random()*3)]; orb.style.left=Math.random()*80+'%'; orb.style.top=Math.random()*80+'%'; blurBg.appendChild(orb); } }
            function updateModeButtons() { if(!modeSelector) return; modeSelector.querySelectorAll('.mode-btn').forEach(b=>{ b.classList.remove('active-online','active-offline'); if(b.dataset.mode===state.mode) b.classList.add(state.mode==='online'?'active-online':'active-offline'); }); }

            // Event listeners
            cameraBtn?.addEventListener('click', startCamera);
            closeCameraBtn?.addEventListener('click', stopCamera);
            cancelCameraBtn?.addEventListener('click', stopCamera);
            capturePhotoBtn?.addEventListener('click', capturePhoto);
            rotateCameraBtn?.addEventListener('click', rotateCamera);
            voiceBtn?.addEventListener('mousedown', e=>{ e.preventDefault(); state.voiceLongPress=setTimeout(startLiveListening,500); });
            voiceBtn?.addEventListener('mouseup', ()=>{ clearTimeout(state.voiceLongPress); if(!state.isLiveListening) startVoiceToText(); });
            voiceBtn?.addEventListener('mouseleave', ()=>clearTimeout(state.voiceLongPress));
            voiceBtn?.addEventListener('touchstart', e=>{ e.preventDefault(); state.voiceLongPress=setTimeout(startLiveListening,500); });
            voiceBtn?.addEventListener('touchend', e=>{ e.preventDefault(); clearTimeout(state.voiceLongPress); if(!state.isLiveListening) startVoiceToText(); });
            endCallBtn?.addEventListener('click', stopLiveCall);
            menuBtn?.addEventListener('click', ()=>{ sidePanel?.classList.toggle('open'); sideOverlay?.classList.toggle('show'); renderChatHistory(); });
            sideOverlay?.addEventListener('click', closeSidePanel);
            settingsBtn?.addEventListener('click', e=>{ e.stopPropagation(); renderSettingsDropdown(); settingsDropdown?.classList.toggle('show'); });
            if(!document.getElementById('newChatBtn')) { const btn = document.createElement('button'); btn.id='newChatBtn'; btn.style.display='none'; document.body.appendChild(btn); }
            document.getElementById('newChatBtn')?.addEventListener('click', createNewChat);
            sendBtn?.addEventListener('click', ()=>{ if(state.isGenerating&&state.abortController) state.abortController.abort(); else sendMessage(); });
            chatInput?.addEventListener('input', updateSendBtnVisibility);
            chatInput?.addEventListener('keydown', e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
            modeSelector?.addEventListener('click', e=>{ if(e.target.classList.contains('mode-btn')){ state.mode=e.target.dataset.mode; updateModeButtons(); saveState(); } });
            uploadBtn?.addEventListener('click',()=>fileInput?.click());
            imageBtn?.addEventListener('click',()=>fileInput?.click());
            docBtn?.addEventListener('click',()=>fileInput?.click());
            fileInput?.addEventListener('change',e=>{ if(e.target.files.length) handleFileSelect(e.target.files); fileInput.value=''; });
            historySearch?.addEventListener('input', renderChatHistory);
            document.addEventListener("click", (e)=>{ if(e.target.classList.contains("copy-code-btn")){ const code=e.target.parentElement.querySelector("code").innerText; navigator.clipboard.writeText(code); showToast("Copied"); } if(e.target.classList.contains("download-code-btn")){ const code=e.target.parentElement.querySelector("code").innerText; const blob=new Blob([code],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="code.txt"; a.click(); URL.revokeObjectURL(a.href); } });
            window.exportChat = function(){ const chat=state.chats[state.currentChatId]; if(!chat) return; let text=""; chat.messages.forEach(msg=>{ text+=`[${msg.role.toUpperCase()}]\n${msg.content}\n\n`; }); const blob=new Blob([text],{type:"text/plain"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="chat.txt"; a.click(); };
            middleLayer?.addEventListener('scroll', ()=>{ const dist=middleLayer.scrollHeight-middleLayer.scrollTop-middleLayer.clientHeight; autoScrollEnabled=dist<150; });
            initBlurOrbs();
            loadState();
            updateSendBtnVisibility();
        } catch (err) { console.error(err); }
    })();
    </script>
</body>

</html>
